<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Space Defense | Mega Arcade</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 0; }
        .nav-bar { background: #1e293b; padding: 15px; text-align: left; }
        .back-btn { color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
        .main-layout { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .game-frame-wrapper { width: 100%; max-width: 800px; height: 500px; background: #000; border: 4px solid #334155; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        iframe { width: 100%; height: 100%; border: none; }
        .ad-row { margin: 20px 0; width: 100%; max-width: 800px; text-align: center; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="back-btn">⬅ Back to Arcade</a>
    </div>

    <div class="main-layout">
        <h2>Playing: Space Defense</h2>

        <!-- Active Playing Frame -->
        <div class="game-frame-wrapper">
            <!-- Replace the src URL below with your actual HTML5 game embed link -->
            <iframe src="https://gamedistribution.com"></iframe>
        </div>

        <!-- Ad Spot Right Below Game Window -->
        <div class="ad-row">
            <!-- PASTE YOUR ADSTERRA BANNER OR NATIVE BANNER ADS HERE -->
            <div style="background:rgba(255,255,255,0.05); padding:20px; border-radius:8px; color:#475569;">[ Game Page Banner Ad Slot ]</div>
        </div>
    </div>

</body>
</html>
